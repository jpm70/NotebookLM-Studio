    <script>
      // Ignorar errores de transporte WebSocket de Vite dev server en entornos iframe/proxy de AI Studio
      window.addEventListener('error', function(e) {
        if (
          e &&
          (e.message?.includes('WebSocket') ||
           e.message?.includes('createWebSocketModuleRunnerTransport') ||
           e.filename?.includes('@vite/client'))
        ) {
          e.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var reason = e && (e.reason?.message || String(e.reason || ''));
        if (reason && (reason.includes('WebSocket') || reason.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">

  </body>
